# Finding ↔ chart mapping table (IMP-F03 / issue #3).
#
# Maps each target chart_id (from decision-analytics-reconstruction's
# governance/FIGURE_MANIFEST.yaml) to the CLOSED findings whose
# verification_script covers that chart's defect class. The ratchet routes
# these charts to verify-only (run the invariant) instead of re-auditing —
# the closed finding is the authority; disagreement with an invariant's
# sufficiency is raised as a change to THIS table, never as a duplicate
# audit finding.
#
# Maintained by hand, schema-checked at load: every finding id named here
# must exist in the target checkout (ratchet aborts otherwise). Charts not
# listed here route by generator-hash dirty detection (skip / full-audit).
